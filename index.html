<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Private Collage Maker</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f5;
    color: #222;
}


/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: #6b7280;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.login-button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    background: #1d4ed8;
}

#errorMessage {
    color: #dc2626;
    text-align: center;
    margin-top: 12px;
    display: none;
}


/* =========================
   APP
========================= */

#appPage {
    display: none;
}

header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.logout {
    background: #374151;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.app {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.panel {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}

.controls {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(180px, 1fr)
    );
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
}

input[type="text"],
input[type="number"],
input[type="email"],
input[type="password"],
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd1d8;
    border-radius: 8px;
    font-size: 15px;
}

input[type="color"] {
    width: 100%;
    height: 42px;
    border: 1px solid #ccd1d8;
    border-radius: 8px;
    cursor: pointer;
}


/* =========================
   UPLOAD
========================= */

.upload-area {
    border: 2px dashed #9ca3af;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    cursor: pointer;
    background: #f9fafb;
}

.upload-area:hover,
.upload-area.dragover {
    border-color: #2563eb;
    background: #eff6ff;
}

.upload-area strong {
    color: #2563eb;
}

#fileInput {
    display: none;
}


/* =========================
   IMAGE LIST
========================= */

.image-list {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px, 1fr)
        );
    gap: 15px;
    margin-top: 20px;
}

.image-item {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px;
    cursor: grab;
    transition: 0.15s;
}

.image-item:active {
    cursor: grabbing;
}

.image-item.dragging {
    opacity: 0.4;
}

.image-item.drag-over {
    border: 3px solid #2563eb;
    transform: scale(1.02);
}

.thumbnail {
    position: relative;
    height: 150px;
    border-radius: 8px;
    overflow: hidden;
    background: #ddd;
    margin-bottom: 10px;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #e5e7eb;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

.image-number {
    font-weight: bold;
    color: #111827;
    margin-bottom: 7px;
}

.image-details {
    width: 100%;
    min-height: 65px;
    resize: vertical;
    padding: 8px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
}

.remove-image {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 27px;
    height: 27px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: rgba(220,38,38,0.9);
    color: white;
    cursor: pointer;
    font-size: 18px;
    z-index: 2;
}


/* =========================
   PAGE BREAK BUTTON
========================= */

.page-break-button {
    width: 100%;
    margin-top: 10px;
    padding: 8px 10px;
    border: 1px dashed #2563eb;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
}

.page-break-button:hover {
    background: #dbeafe;
}

.page-break-button.active {
    background: #2563eb;
    color: white;
    border-style: solid;
}

.page-break-label {
    margin-top: 8px;
    text-align: center;
    color: #2563eb;
    font-size: 12px;
    font-weight: bold;
}


/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.primary:hover {
    background: #1d4ed8;
}


/* =========================
   PREVIEW
========================= */

.preview-container {
    overflow: auto;
    background: #d1d5db;
    padding: 25px;
    border-radius: 10px;
}

.preview-page {
    margin: 0 auto 25px auto;
    text-align: center;
}

.preview-page-label {
    color: #374151;
    font-weight: bold;
    margin-bottom: 8px;
}

.preview-page canvas {
    display: block;
    margin: auto;
    max-width: 100%;
    height: auto;
    box-shadow: 0 5px 25px rgba(0,0,0,0.25);
    background: white;
}

.info {
    color: #6b7280;
    font-size: 13px;
    margin-top: 10px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .app {
        margin-top: 10px;
    }

    .panel {
        padding: 15px;
    }

    .preview-container {
        padding: 10px;
    }

    .image-list {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>🔐 Collage Maker</h1>

        <p>Private access</p>

        <input
            type="email"
            id="email"
            placeholder="Email address"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            class="login-button"
            id="loginButton"
        >
            Login
        </button>

        <div id="errorMessage"></div>

    </div>

</div>



<!-- =========================
     APP
========================= -->

<div id="appPage">


<header>

    <h1>📸 Collage Maker</h1>

    <button
        class="logout"
        id="logoutButton"
    >
        Logout
    </button>

</header>


<div class="app">


<!-- =========================
     SETTINGS
========================= -->

<div class="panel">

    <h2>1. Collage Settings</h2>

    <div class="controls">


        <div>

            <label>
                Header
            </label>

            <input
                type="text"
                id="headerText"
                value="My Photo Collage"
            >

        </div>


        <div>

            <label>
                Page Size
            </label>

            <select id="pageSize">

                <option value="a4">
                    A4
                </option>

                <option value="letter">
                    Letter
                </option>

            </select>

        </div>


        <div>

            <label>
                Orientation
            </label>

            <select id="orientation">

                <option value="portrait">
                    Portrait
                </option>

                <option value="landscape">
                    Landscape
                </option>

            </select>

        </div>


        <div>

            <label>
                Columns
            </label>

            <select id="columns">

                <option value="1">
                    1
                </option>

                <option value="2" selected>
                    2
                </option>

                <option value="3">
                    3
                </option>

                <option value="4">
                    4
                </option>

                <option value="5">
                    5
                </option>

            </select>

        </div>


        <div>

            <label>
                Images Per Page
            </label>

            <select id="imagesPerPage">

                <option value="1">
                    1
                </option>

                <option value="2">
                    2
                </option>

                <option value="4">
                    4
                </option>

                <option value="6" selected>
                    6
                </option>

                <option value="8">
                    8
                </option>

                <option value="9">
                    9
                </option>

                <option value="12">
                    12
                </option>

                <option value="16">
                    16
                </option>

                <option value="20">
                    20
                </option>

                <option value="24">
                    24
                </option>

            </select>

        </div>


        <div>

            <label>
                Image Spacing
            </label>

            <input
                type="number"
                id="spacing"
                value="10"
                min="0"
                max="100"
            >

        </div>


        <div>

            <label>
                Page Margin
            </label>

            <input
                type="number"
                id="margin"
                value="30"
                min="0"
                max="150"
            >

        </div>


        <div>

            <label>
                Header Size
            </label>

            <input
                type="number"
                id="headerSize"
                value="40"
                min="10"
                max="100"
            >

        </div>


        <div>

            <label>
                Background
            </label>

            <input
                type="color"
                id="background"
                value="#ffffff"
            >

        </div>


        <div>

            <label>
                Starting Page Number
            </label>

            <input
                type="number"
                id="startingPageNumber"
                value="1"
                min="1"
            >

        </div>


        <div>

            <label>
                Starting Image Number
            </label>

            <input
                type="number"
                id="startingImageNumber"
                value="1"
                min="1"
            >

        </div>


    </div>

</div>



<!-- =========================
     IMAGES
========================= -->

<div class="panel">

    <h2>2. Add Images</h2>

    <div
        class="upload-area"
        id="uploadArea"
    >

        <strong>
            Click here
        </strong>

        or drag images here

        <br>

        <span class="info">
            Select multiple JPG, PNG or WEBP images.
        </span>

    </div>


    <input
        type="file"

        <button

            Clear Images
        </button>

    </div>

</div>



<!-- =========================
     PREVIEW
========================= -->

<div class="panel">

    <h2>3. Preview</h2>

    <div
        class="preview-container"
        id="previewContainer"
    >
    </div>


    <div class="buttons">

        <button
            class="primary"
            id="downloadButton"
        >
            📄 Download PDF
        </button>

    </div>

</div>


</div>

</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyC-FbJVXLEgLGEFiyHIpG2wEZlLj7_kYNg",

    authDomain:
        "collage-maker-69004.firebaseapp.com",

    projectId:
        "collage-maker-69004",

    storageBucket:
        "collage-maker-69004.firebasestorage.app",

    messagingSenderId:
        "657246424756",

    appId:
        "1:657246424756:web:eee039fe60a6af0e49d1e1",

    measurementId:
        "G-HKM9MCHZFC"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);



/* =========================
   LOGIN
========================= */

const loginPage =
    document.getElementById(
        "loginPage"
    );

const appPage =
    document.getElementById(
        "appPage"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


loginButton.addEventListener(
    "click",
    async () => {

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        errorMessage.style.display =
            "none";


        if (!email || !password) {

            showError(
                "Please enter your email and password."
            );

            return;

        }


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

        catch (error) {

            console.error(error);

            showError(
                "Incorrect email or password."
            );

        }

    }
);


function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

}


logoutButton.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


onAuthStateChanged(
    auth,
    user => {

        if (user) {

            loginPage.style.display =
                "none";

            appPage.style.display =
                "block";

        }

        else {

            loginPage.style.display =
                "flex";

            appPage.style.display =
                "none";

        }

    }
);



/* =========================
   ELEMENTS
========================= */

const fileInput =
    document.getElementById(
        "fileInput"
    );

const uploadArea =
    document.getElementById(
        "uploadArea"
    );

const imageList =
    document.getElementById(
        "imageList"
    );

const clearButton =
    document.getElementById(
        "clearButton"
    );

const downloadButton =
    document.getElementById(
        "downloadButton"
    );

const headerText =
    document.getElementById(
        "headerText"
    );

const pageSize =
    document.getElementById(
        "pageSize"
    );

const orientation =
    document.getElementById(
        "orientation"
    );

const columns =
    document.getElementById(
        "columns"
    );

const imagesPerPage =
    document.getElementById(
        "imagesPerPage"
    );

const spacing =
    document.getElementById(
        "spacing"
    );

const margin =
    document.getElementById(
        "margin"
    );

const headerSize =
    document.getElementById(
        "headerSize"
    );

const background =
    document.getElementById(
        "background"
    );

const startingPageNumber =
    document.getElementById(
        "startingPageNumber"
    );

const startingImageNumber =
    document.getElementById(
        "startingImageNumber"
    );

const previewContainer =
    document.getElementById(
        "previewContainer"
    );


let images = [];


/*
 * Each value is the image index
 * AFTER WHICH a new page starts.
 *
 * Example:
 *
 * [2]
 *
 * means:
 *
 * Page 1 = images 1,2,3
 * Page 2 = images 4...
 *
 * Internally we store zero-based
 * image indexes.
 */

let manualPageBreaks = new Set();



/* =========================
   UPLOAD
========================= */

uploadArea.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    event => {

        addFiles(
            event.target.files
        );

        fileInput.value = "";

    }
);


uploadArea.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        uploadArea.classList.add(
            "dragover"
        );

    }
);


uploadArea.addEventListener(
    "dragleave",
    () => {

        uploadArea.classList.remove(
            "dragover"
        );

    }
);


uploadArea.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        uploadArea.classList.remove(
            "dragover"
        );

        addFiles(
            event.dataTransfer.files
        );

    }
);



function addFiles(files) {

    [...files].forEach(
        file => {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                return;

            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            images.push({

                                image:
                                    img,

                                name:
                                    file.name,

                                details:
                                    ""

                            });


                            renderThumbnails();

                            renderCanvas();

                        };


                    img.src =
                        event.target.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =========================
   PAGE CALCULATION
========================= */

/*
 * Converts the image list into
 * actual pages.
 *
 * Automatic rule:
 *
 * imagesPerPage = maximum number
 * of images allowed on one page.
 *
 * Manual page breaks:
 *
 * If a break exists after an image,
 * the next image starts a new page.
 */

function getPages() {

    const pages = [];

    let currentPage = [];

    const maxPerPage =
        Math.max(
            1,
            Number(
                imagesPerPage.value
            ) || 1
        );


    images.forEach(
        (item, index) => {

            currentPage.push(
                index
            );


            const reachedLimit =
                currentPage.length >=
                maxPerPage;


            const hasManualBreak =
                manualPageBreaks.has(
                    index
                );


            if (
                reachedLimit ||
                hasManualBreak
            ) {

                pages.push(
                    currentPage
                );

                currentPage = [];

            }

        }
    );


    if (
        currentPage.length > 0
    ) {

        pages.push(
            currentPage
        );

    }


    return pages;

}



/* =========================
   THUMBNAILS
========================= */

function renderThumbnails() {

    imageList.innerHTML = "";


    const firstImageNumber =
        Number(
            startingImageNumber.value
        ) || 1;


    images.forEach(
        (item, index) => {

            const imageNumber =
                firstImageNumber +
                index;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "image-item";


            div.draggable =
                true;


            div.dataset.index =
                index;


            const hasBreak =
                manualPageBreaks.has(
                    index
                );


            div.innerHTML = `

                <div class="thumbnail">

                    <img
                        src="${item.image.src}"
                        draggable="false"
                    >

                    <button
                        class="remove-image"
                        data-index="${index}"
                        type="button"
                    >
                        ×
                    </button>

                </div>


                <div class="image-number">
                    Image ${imageNumber}
                </div>


                <textarea
                    class="image-details"
                    data-index="${index}"
                    placeholder="Enter details for image ${imageNumber}..."
                >${escapeHtml(item.details)}</textarea>


                <button
                    class="page-break-button ${hasBreak ? "active" : ""}"
                    data-index="${index}"
                    type="button"
                >
                    ${hasBreak
                        ? "↩ Remove Page Break"
                        : "＋ Add New Page After"}
                </button>


                ${
                    hasBreak
                        ? `<div class="page-break-label">
                                Next image starts a new page
                           </div>`
                        : ""
                }

            `;


            imageList.appendChild(
                div
            );

        }
    );


    /* =========================
       REMOVE
    ========================= */

    document
        .querySelectorAll(
            ".remove-image"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();


                        const index =
                            Number(
                                this.dataset.index
                            );


                        images.splice(
                            index,
                            1
                        );


                        /*
                         * Rebuild manual breaks
                         * after deleting an image.
                         */

                        const newBreaks =
                            new Set();


                        manualPageBreaks.forEach(
                            breakIndex => {

                                if (
                                    breakIndex ===
                                    index
                                ) {

                                    return;

                                }


                                if (
                                    breakIndex >
                                    index
                                ) {

                                    newBreaks.add(
                                        breakIndex - 1
                                    );

                                }

                                else {

                                    newBreaks.add(
                                        breakIndex
                                    );

                                }

                            }
                        );


                        manualPageBreaks =
                            newBreaks;


                        renderThumbnails();

                        renderCanvas();

                    }
                );

            }
        );


    /* =========================
       DETAILS
    ========================= */

    document
        .querySelectorAll(
            ".image-details"
        )
        .forEach(
            textarea => {

                textarea.addEventListener(
                    "input",
                    function(event) {

                        event.stopPropagation();


                        const index =
                            Number(
                                this.dataset.index
                            );


                        if (
                            images[index]
                        ) {

                            images[index].details =
                                this.value;

                        }


                        renderCanvas();

                    }
                );


                textarea.addEventListener(
                    "mousedown",
                    event => {

                        event.stopPropagation();

                    }
                );

            }
        );


    /* =========================
       PAGE BREAK
    ========================= */

    document
        .querySelectorAll(
            ".page-break-button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(event) {

                        event.preventDefault();

                        event.stopPropagation();


                        const index =
                            Number(
                                this.dataset.index
                            );


                        if (
                            manualPageBreaks.has(
                                index
                            )
                        ) {

                            manualPageBreaks.delete(
                                index
                            );

                        }

                        else {

                            manualPageBreaks.add(
                                index
                            );

                        }


                        renderThumbnails();

                        renderCanvas();

                    }
                );

            }
        );


    /* =========================
       DRAG & DROP
    ========================= */

    document
        .querySelectorAll(
            ".image-item"
        )
        .forEach(
            item => {


                item.addEventListener(
                    "dragstart",
                    function(event) {

                        this.classList.add(
                            "dragging"
                        );


                        event.dataTransfer.effectAllowed =
                            "move";


                        event.dataTransfer.setData(
                            "text/plain",
                            this.dataset.index
                        );

                    }
                );


                item.addEventListener(
                    "dragend",
                    function() {

                        this.classList.remove(
                            "dragging"
                        );


                        document
                            .querySelectorAll(
                                ".image-item"
                            )
                            .forEach(
                                element => {

                                    element.classList.remove(
                                        "drag-over"
                                    );

                                }
                            );

                    }
                );


                item.addEventListener(
                    "dragover",
                    function(event) {

                        event.preventDefault();

                        event.dataTransfer.dropEffect =
                            "move";

                        this.classList.add(
                            "drag-over"
                        );

                    }
                );


                item.addEventListener(
                    "dragleave",
                    function() {

                        this.classList.remove(
                            "drag-over"
                        );

                    }
                );


                item.addEventListener(
                    "drop",
                    function(event) {

                        event.preventDefault();


                        this.classList.remove(
                            "drag-over"
                        );


                        const fromIndex =
                            Number(
                                event.dataTransfer
                                    .getData(
                                        "text/plain"
                                    )
                            );


                        const toIndex =
                            Number(
                                this.dataset.index
                            );


                        if (
                            Number.isNaN(
                                fromIndex
                            )
                        ) {

                            return;

                        }


                        if (
                            fromIndex ===
                            toIndex
                        ) {

                            return;

                        }


                        const movedImage =
                            images.splice(
                                fromIndex,
                                1
                            )[0];


                        images.splice(
                            toIndex,
                            0,
                            movedImage
                        );


                        /*
                         * Recalculate manual page
                         * breaks based on the new
                         * image order.
                         */

                        const oldBreaks =
                            [...manualPageBreaks]
                                .sort(
                                    (a, b) =>
                                        a - b
                                );


                        manualPageBreaks =
                            new Set();


                        oldBreaks.forEach(
                            breakIndex => {

                                let newIndex =
                                    breakIndex;


                                if (
                                    fromIndex <
                                    breakIndex
                                ) {

                                    newIndex--;

                                }


                                if (
                                    toIndex <=
                                    breakIndex
                                ) {

                                    newIndex++;

                                }


                                if (
                                    newIndex >= 0 &&
                                    newIndex <
                                    images.length
                                ) {

                                    manualPageBreaks.add(
                                        newIndex
                                    );

                                }

                            }
                        );


                        renderThumbnails();

                        renderCanvas();

                    }
                );

            }
        );

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

/* =========================
   SETTINGS OBJECT
========================= */

function getSettings() {

    return {

        header:
            headerText.value ||
            "My Photo Collage",

        pageSize:
            pageSize.value,

        orientation:
            orientation.value,

        columns:
            Number(
                columns.value
            ),

        imagesPerPage:
            Math.max(
                1,
                Number(
                    imagesPerPage.value
                ) || 1
            ),

        spacing:
            Number(
                spacing.value
            ),

        margin:
            Number(
                margin.value
            ),

        headerSize:
            Number(
                headerSize.value
            ),

        background:
            background.value,

        startingPageNumber:
            Number(
                startingPageNumber.value
            ) || 1,

        startingImageNumber:
            Number(
                startingImageNumber.value
            ) || 1

    };

}



/* =========================
   PAGE DIMENSIONS
========================= */

function getPageDimensions(
    settings
) {

    let width;
    let height;


    if (
        settings.pageSize ===
        "a4"
    ) {

        width = 1240;
        height = 1754;

    }

    else {

        width = 1275;
        height = 1650;

    }


    if (
        settings.orientation ===
        "landscape"
    ) {

        [
            width,
            height
        ] = [
            height,
            width
        ];

    }


    return {
        width,
        height
    };

}



/* =========================
   DRAW IMAGE WITHOUT
   STRETCHING
========================= */

function drawImageContain(
    context,
    image,
    x,
    y,
    width,
    height
) {

    const imageRatio =
        image.width /
        image.height;


    const boxRatio =
        width /
        height;


    let drawWidth;
    let drawHeight;


    if (
        imageRatio >
        boxRatio
    ) {

        drawWidth =
            width;

        drawHeight =
            width /
            imageRatio;

    }

    else {

        drawHeight =
            height;

        drawWidth =
            height *
            imageRatio;

    }


    const drawX =
        x +
        (
            width -
            drawWidth
        ) / 2;


    const drawY =
        y +
        (
            height -
            drawHeight
        ) / 2;


    context.drawImage(
        image,
        drawX,
        drawY,
        drawWidth,
        drawHeight
    );

}



/* =========================
   TEXT WRAPPING
========================= */

function wrapText(
    context,
    text,
    maxWidth
) {

    const words =
        text.split(
            /\s+/
        );


    const lines = [];

    let line = "";


    words.forEach(
        word => {

            const testLine =
                line
                    ? line +
                      " " +
                      word
                    : word;


            const testWidth =
                context.measureText(
                    testLine
                ).width;


            if (
                testWidth >
                maxWidth &&
                line
            ) {

                lines.push(
                    line
                );

                line =
                    word;

            }

            else {

                line =
                    testLine;

            }

        }
    );


    if (line) {

        lines.push(
            line
        );

    }


    return lines;

}



/* =========================
   DRAW ONE CANVAS PAGE
========================= */

function drawPage(
    pageIndexes,
    pageNumber,
    settings
) {

    const page =
        getPageDimensions(
            settings
        );


    const pageCanvas =
        document.createElement(
            "canvas"
        );


    pageCanvas.width =
        page.width;

    pageCanvas.height =
        page.height;


    const context =
        pageCanvas.getContext(
            "2d"
        );


    /* BACKGROUND */

    context.fillStyle =
        settings.background;


    context.fillRect(
        0,
        0,
        pageCanvas.width,
        pageCanvas.height
    );


    /* HEADER */

    context.fillStyle =
        "#111827";


    context.font =
        `bold ${settings.headerSize}px Arial`;


    context.textAlign =
        "center";


    context.textBaseline =
        "middle";


    context.fillText(
        settings.header,
        pageCanvas.width / 2,
        settings.margin +
        settings.headerSize
    );


    /* PAGE NUMBER */

    context.font =
        "22px Arial";


    context.fillStyle =
        "#6b7280";


    context.fillText(
        "Page " +
        pageNumber,
        pageCanvas.width / 2,
        pageCanvas.height -
        settings.margin / 2
    );


    if (
        pageIndexes.length === 0
    ) {

        return pageCanvas;

    }


    const cols =
        Math.min(
            settings.columns,
            pageIndexes.length
        );


    const rows =
        Math.ceil(
            pageIndexes.length /
            cols
        );


    const topSpace =
        settings.margin +
        settings.headerSize *
        2;


    const bottomSpace =
        settings.margin *
        2;


    const availableWidth =
        pageCanvas.width -
        settings.margin *
        2;


    const availableHeight =
        pageCanvas.height -
        topSpace -
        bottomSpace;


    const cellWidth =
        (
            availableWidth -
            settings.spacing *
            (cols - 1)
        ) / cols;


    const cellHeight =
        (
            availableHeight -
            settings.spacing *
            (rows - 1)
        ) / rows;


    pageIndexes.forEach(
        (
            imageIndex,
            localIndex
        ) => {

            const item =
                images[
                    imageIndex
                ];


            const row =
                Math.floor(
                    localIndex /
                    cols
                );


            const col =
                localIndex %
                cols;


            const x =
                settings.margin +
                col *
                (
                    cellWidth +
                    settings.spacing
                );


            const y =
                topSpace +
                row *
                (
                    cellHeight +
                    settings.spacing
                );


            const imageNumber =
                settings.startingImageNumber +
                imageIndex;


            const detailsHeight =
                Math.min(
                    180,
                    cellHeight *
                    0.28
                );


            const imageHeight =
                Math.max(
                    30,
                    cellHeight -
                    detailsHeight -
                    15
                );


            drawImageContain(
                context,
                item.image,
                x,
                y,
                cellWidth,
                imageHeight
            );


            /* IMAGE NUMBER */

            context.textAlign =
                "left";


            context.textBaseline =
                "top";


            context.fillStyle =
                "#111827";


            context.font =
                "bold 24px Arial";


            context.fillText(
                imageNumber +
                ".",
                x,
                y +
                imageHeight +
                5
            );


            /* DETAILS */

            if (
                item.details &&
                item.details.trim()
            ) {

                context.font =
                    "20px Arial";


                const detailsX =
                    x + 35;


                const detailsWidth =
                    Math.max(
                        20,
                        cellWidth - 35
                    );


                const lines =
                    wrapText(
                        context,
                        item.details.trim(),
                        detailsWidth
                    );


                lines
                    .slice(
                        0,
                        5
                    )
                    .forEach(
                        (
                            line,
                            lineIndex
                        ) => {

                            context.fillText(
                                line,
                                detailsX,
                                y +
                                imageHeight +
                                5 +
                                lineIndex *
                                25
                            );

                        }
                    );

            }

        }
    );


    return pageCanvas;

}



/* =========================
   CANVAS PREVIEW
========================= */

function renderCanvas() {

    previewContainer.innerHTML = "";


    const settings =
        getSettings();


    const pages =
        getPages();


    if (
        pages.length === 0
    ) {

        const emptyPage =
            drawPage(
                [],
                settings.startingPageNumber,
                settings
            );


        const wrapper =
            document.createElement(
                "div"
            );


        wrapper.className =
            "preview-page";


        wrapper.innerHTML = `
            <div class="preview-page-label">
                Page ${settings.startingPageNumber}
            </div>
        `;


        wrapper.appendChild(
            emptyPage
        );


        previewContainer.appendChild(
            wrapper
        );


        return;

    }


    pages.forEach(
        (
            pageIndexes,
            pageIndex
        ) => {

            const pageNumber =
                settings.startingPageNumber +
                pageIndex;


            const pageCanvas =
                drawPage(
                    pageIndexes,
                    pageNumber,
                    settings
                );


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "preview-page";


            wrapper.innerHTML = `
                <div class="preview-page-label">
                    Page ${pageNumber}
                    — ${pageIndexes.length} image${pageIndexes.length === 1 ? "" : "s"}
                </div>
            `;


            wrapper.appendChild(
                pageCanvas
            );


            previewContainer.appendChild(
                wrapper
            );

        }
    );

}



/* =========================
   PDF DOWNLOAD
========================= */

downloadButton.addEventListener(
    "click",
    () => {

        if (
            images.length === 0
        ) {

            alert(
                "Please add at least one image."
            );

            return;

        }


        const settings =
            getSettings();


        const pages =
            getPages();


        if (
            pages.length === 0
        ) {

            return;

        }


        let pdfWidth;
        let pdfHeight;


        if (
            settings.pageSize ===
            "a4"
        ) {

            pdfWidth = 210;
            pdfHeight = 297;

        }

        else {

            pdfWidth = 215.9;
            pdfHeight = 279.4;

        }


        if (
            settings.orientation ===
            "landscape"
        ) {

            [
                pdfWidth,
                pdfHeight
            ] = [
                pdfHeight,
                pdfWidth
            ];

        }


        const pdf =
            new jspdf.jsPDF({

                orientation:
                    settings.orientation,

                unit:
                    "mm",

                format:
                    settings.pageSize ===
                    "a4"
                        ? "a4"
                        : "letter"

            });


        pages.forEach(
            (
                pageIndexes,
                pageIndex
            ) => {

                if (
                    pageIndex > 0
                ) {

                    pdf.addPage(
                        settings.pageSize ===
                        "a4"
                            ? "a4"
                            : "letter",

                        settings.orientation
                    );

                }


                /*
                 * Render the exact same
                 * page used by preview.
                 */

                const pageCanvas =
                    drawPage(
                        pageIndexes,
                        settings.startingPageNumber +
                        pageIndex,
                        settings
                    );


                const imageData =
                    pageCanvas.toDataURL(
                        "image/jpeg",
                        0.92
                    );


                pdf.addImage(
                    imageData,
                    "JPEG",
                    0,
                    0,
                    pdfWidth,
                    pdfHeight
                );

            }
        );


        /* =========================
           FILENAME
        ========================= */

        let filename =
            settings.header
                .trim()
                .replace(
                    /[^a-z0-9]/gi,
                    "_"
                )
                .replace(
                    /_+/g,
                    "_"
                );


        if (!filename) {

            filename =
                "collage";

        }


        pdf.save(
            filename +
            ".pdf"
        );

    }
);



/* =========================
   INITIAL
========================= */

renderThumbnails();

renderCanvas();

</script>
