<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Collage Maker</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1f5;
    color: #222;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 400px;
    padding: 35px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12);
}

.login-box h1 {
    margin-top: 0;
    text-align: center;
}

.login-box p {
    text-align: center;
    color: #6b7280;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.login-button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    background: #1d4ed8;
}

#errorMessage {
    color: #dc2626;
    text-align: center;
    margin-top: 12px;
    display: none;
}

/* APP */

#appPage {
    display: none;
}

header {
    background: #111827;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.logout {
    background: #374151;
    color: white;
    border: none;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.app {
    max-width: 1200px;
    margin: 25px auto;
    padding: 0 15px;
}

.panel {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
}

.controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
}

input[type="text"],
input[type="number"],
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd1d8;
    border-radius: 8px;
    font-size: 15px;
}

input[type="color"] {
    width: 100%;
    height: 42px;
    border: 1px solid #ccd1d8;
    border-radius: 8px;
    cursor: pointer;
}

.upload-area {
    border: 2px dashed #9ca3af;
    border-radius: 12px;
    padding: 35px 20px;
    text-align: center;
    cursor: pointer;
    background: #f9fafb;
}

.upload-area:hover,
.upload-area.dragover {
    border-color: #2563eb;
    background: #eff6ff;
}

.upload-area strong {
    color: #2563eb;
}

#fileInput {
    display: none;
}

.image-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    margin-top: 20px;
}

.thumbnail {
    position: relative;
    height: 110px;
    border-radius: 8px;
    overflow: hidden;
    background: #ddd;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.remove-image {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 25px;
    height: 25px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: rgba(220,38,38,0.9);
    color: white;
    cursor: pointer;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

button {
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.primary {
    background: #2563eb;
    color: white;
}

.secondary {
    background: #e5e7eb;
    color: #111827;
}

.preview-container {
    overflow: auto;
    background: #d1d5db;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
}

#canvas {
    display: block;
    margin: auto;
    max-width: 100%;
    height: auto;
    box-shadow: 0 5px 25px rgba(0,0,0,0.25);
    background: white;
}

.info {
    color: #6b7280;
    font-size: 13px;
    margin-top: 10px;
}

@media (max-width: 600px) {
    .app {
        margin-top: 10px;
    }

    .panel {
        padding: 15px;
    }

    .preview-container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>🔐 Collage Maker</h1>

        <p>Private access</p>

        <input
            type="email"
            id="email"
            placeholder="Email address"
            autocomplete="username">

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">

        <button class="login-button" id="loginButton">
            Login
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- =========================
     COLLAGE APP
========================= -->

<div id="appPage">

<header>

    <h1>📸 Collage Maker</h1>

    <button class="logout" id="logoutButton">
        Logout
    </button>

</header>


<div class="app">

    <!-- SETTINGS -->

    <div class="panel">

        <h2>1. Collage Settings</h2>

        <div class="controls">

            <div>
                <label>Header</label>

                <input
                    type="text"
                    id="headerText"
                    value="My Photo Collage">
            </div>

            <div>
                <label>Page Size</label>

                <select id="pageSize">
                    <option value="a4">A4</option>
                    <option value="letter">Letter</option>
                </select>
            </div>

            <div>
                <label>Orientation</label>

                <select id="orientation">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                </select>
            </div>

            <div>
                <label>Columns</label>

                <select id="columns">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div>
                <label>Image Spacing</label>

                <input
                    type="number"
                    id="spacing"
                    value="10"
                    min="0"
                    max="100">
            </div>

            <div>
                <label>Page Margin</label>

                <input
                    type="number"
                    id="margin"
                    value="30"
                    min="0"
                    max="150">
            </div>

            <div>
                <label>Header Size</label>

                <input
                    type="number"
                    id="headerSize"
                    value="40"
                    min="10"
                    max="100">
            </div>

            <div>
                <label>Background</label>

                <input
                    type="color"
                    id="background"
                    value="#ffffff">
            </div>

        </div>

    </div>


    <!-- UPLOAD -->

    <div class="panel">

        <h2>2. Add Images</h2>

        <div class="upload-area" id="uploadArea">

            <strong>Click here</strong>
            or drag images here

            <br>

            <span class="info">
                Select multiple JPG, PNG or WEBP images.
            </span>

        </div>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
            multiple>

        <div
            class="image-list"
            id="imageList">
        </div>

        <div class="buttons">

            <button
                class="secondary"
                id="clearButton">
                Clear Images
            </button>

        </div>

    </div>


    <!-- PREVIEW -->

    <div class="panel">

        <h2>3. Preview</h2>

        <div class="preview-container">

            <canvas id="canvas"></canvas>

        </div>

        <div class="buttons">

            <button
                class="primary"
                id="downloadButton">
                📄 Download PDF
            </button>

        </div>

    </div>

</div>

</div>


<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyC-FbJVXLEgLGEFiyHIpG2wEZlLj7_kYNg",

    authDomain:
        "collage-maker-69004.firebaseapp.com",

    projectId:
        "collage-maker-69004",

    storageBucket:
        "collage-maker-69004.firebasestorage.app",

    messagingSenderId:
        "657246424756",

    appId:
        "1:657246424756:web:eee039fe60a6af0e49d1e1",

    measurementId:
        "G-HKM9MCHZFC"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* =========================
   LOGIN
========================= */

const loginPage =
    document.getElementById("loginPage");

const appPage =
    document.getElementById("appPage");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const errorMessage =
    document.getElementById("errorMessage");


loginButton.addEventListener(
    "click",
    async () => {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        errorMessage.style.display = "none";


        if (!email || !password) {

            showError(
                "Please enter your email and password."
            );

            return;
        }


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        } catch (error) {

            console.error(error);

            showError(
                "Incorrect email or password."
            );

        }

    }
);


function showError(message) {

    errorMessage.textContent = message;

    errorMessage.style.display = "block";

}


logoutButton.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    user => {

        if (user) {

            loginPage.style.display = "none";

            appPage.style.display = "block";

        } else {

            loginPage.style.display = "flex";

            appPage.style.display = "none";

        }

    }
);


/* =========================
   COLLAGE CODE
========================= */

const fileInput =
    document.getElementById("fileInput");

const uploadArea =
    document.getElementById("uploadArea");

const imageList =
    document.getElementById("imageList");

const clearButton =
    document.getElementById("clearButton");

const downloadButton =
    document.getElementById("downloadButton");

const headerText =
    document.getElementById("headerText");

const pageSize =
    document.getElementById("pageSize");

const orientation =
    document.getElementById("orientation");

const columns =
    document.getElementById("columns");

const spacing =
    document.getElementById("spacing");

const margin =
    document.getElementById("margin");

const headerSize =
    document.getElementById("headerSize");

const background =
    document.getElementById("background");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let images = [];


/* IMAGE UPLOAD */

uploadArea.addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    event => {

        addFiles(event.target.files);

        fileInput.value = "";

    }
);


uploadArea.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        uploadArea.classList.add("dragover");

    }
);


uploadArea.addEventListener(
    "dragleave",
    () => {

        uploadArea.classList.remove(
            "dragover"
        );

    }
);


uploadArea.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        uploadArea.classList.remove(
            "dragover"
        );

        addFiles(
            event.dataTransfer.files
        );

    }
);


function addFiles(files) {

    [...files].forEach(file => {

        if (!file.type.startsWith("image/")) {
            return;
        }

        const reader =
            new FileReader();


        reader.onload =
            event => {

                const img =
                    new Image();


                img.onload =
                    () => {

                        images.push({
                            image: img,
                            name: file.name
                        });

                        renderThumbnails();

                        renderCanvas();

                    };


                img.src =
                    event.target.result;

            };


        reader.readAsDataURL(file);

    });

}


/* THUMBNAILS */

function renderThumbnails() {

    imageList.innerHTML = "";


    images.forEach(
        (item, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "thumbnail";


            div.innerHTML = `
                <img src="${item.image.src}">
                <button
                    class="remove-image"
                    data-index="${index}">
                    ×
                </button>
            `;


            imageList.appendChild(div);

        }
    );


    document
        .querySelectorAll(".remove-image")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const index =
                        Number(
                            this.dataset.index
                        );


                    images.splice(
                        index,
                        1
                    );


                    renderThumbnails();

                    renderCanvas();

                }
            );

        });

}


/* CLEAR */

clearButton.addEventListener(
    "click",
    () => {

        images = [];

        renderThumbnails();

        renderCanvas();

    }
);


/* SETTINGS */

[
    headerText,
    pageSize,
    orientation,
    columns,
    spacing,
    margin,
    headerSize,
    background
].forEach(element => {

    element.addEventListener(
        "input",
        renderCanvas
    );

    element.addEventListener(
        "change",
        renderCanvas
    );

});


/* DRAW */

function renderCanvas() {

    const settings =
        getSettings();


    const page =
        getPageDimensions(
            settings
        );


    canvas.width =
        page.width;

    canvas.height =
        page.height;


    ctx.fillStyle =
        settings.background;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#111827";


    ctx.font =
        `bold ${settings.headerSize}px Arial`;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        settings.header,
        canvas.width / 2,
        settings.margin +
        settings.headerSize
    );


    if (images.length === 0) {

        ctx.fillStyle =
            "#9ca3af";

        ctx.font =
            "30px Arial";


        ctx.fillText(
            "Add images to create your collage",
            canvas.width / 2,
            canvas.height / 2
        );


        return;
    }


    const cols =
        settings.columns;


    const rows =
        Math.ceil(
            images.length / cols
        );


    const topSpace =
        settings.margin +
        settings.headerSize * 2;


    const availableWidth =
        canvas.width -
        settings.margin * 2;


    const availableHeight =
        canvas.height -
        topSpace -
        settings.margin;


    const cellWidth =
        (
            availableWidth -
            settings.spacing *
            (cols - 1)
        ) / cols;


    const cellHeight =
        (
            availableHeight -
            settings.spacing *
            (rows - 1)
        ) / rows;


    images.forEach(
        (item, index) => {

            const row =
                Math.floor(
                    index / cols
                );


            const col =
                index % cols;


            const x =
                settings.margin +
                col *
                (
                    cellWidth +
                    settings.spacing
                );


            const y =
                topSpace +
                row *
                (
                    cellHeight +
                    settings.spacing
                );


            drawImageCover(
                ctx,
                item.image,
                x,
                y,
                cellWidth,
                cellHeight
            );

        }
    );

}


/* IMAGE COVER */

function drawImageCover(
    ctx,
    image,
    x,
    y,
    width,
    height
) {
    const imageRatio =
        image.width / image.height;

    const boxRatio =
        width / height;

    let drawWidth;
    let drawHeight;

    if (imageRatio > boxRatio) {
        drawWidth = width;
        drawHeight = width / imageRatio;
    } else {
        drawHeight = height;
        drawWidth = height * imageRatio;
    }

    const drawX =
        x + (width - drawWidth) / 2;

    const drawY =
        y + (height - drawHeight) / 2;

    ctx.drawImage(
        image,
        drawX,
        drawY,
        drawWidth,
        drawHeight
    );
}

/* SETTINGS */

function getSettings() {

    return {

        header:
            headerText.value ||
            "My Photo Collage",

        pageSize:
            pageSize.value,

        orientation:
            orientation.value,

        columns:
            Number(
                columns.value
            ),

        spacing:
            Number(
                spacing.value
            ),

        margin:
            Number(
                margin.value
            ),

        headerSize:
            Number(
                headerSize.value
            ),

        background:
            background.value

    };

}


/* PAGE SIZE */

function getPageDimensions(
    settings
) {

    let width;
    let height;


    if (
        settings.pageSize ===
        "a4"
    ) {

        width = 2480;
        height = 3508;

    } else {

        width = 2550;
        height = 3300;

    }


    if (
        settings.orientation ===
        "landscape"
    ) {

        [width, height] =
            [height, width];

    }


    return {
        width,
        height
    };

}


/* DOWNLOAD PDF */

downloadButton.addEventListener(
    "click",
    () => {

        if (images.length === 0) {

            alert(
                "Please add at least one image."
            );

            return;

        }


        const settings =
            getSettings();


        const pdf =
            new jspdf.jsPDF({

                orientation:
                    settings.orientation,

                unit:
                    "mm",

                format:
                    settings.pageSize ===
                    "a4"
                        ? "a4"
                        : "letter"

            });


        const imageData =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        const pdfWidth =
            settings.orientation ===
            "portrait"

                ? (
                    settings.pageSize === "a4"
                        ? 210
                        : 215.9
                  )

                : (
                    settings.pageSize === "a4"
                        ? 297
                        : 279.4
                  );


        const pdfHeight =
            settings.orientation ===
            "portrait"

                ? (
                    settings.pageSize === "a4"
                        ? 297
                        : 279.4
                  )

                : (
                    settings.pageSize === "a4"
                        ? 210
                        : 215.9
                  );


        pdf.addImage(
            imageData,
            "JPEG",
            0,
            0,
            pdfWidth,
            pdfHeight
        );


        let filename =
            settings.header
                .trim()
                .replace(
                    /[^a-z0-9]/gi,
                    "_"
                )
                .replace(
                    /_+/g,
                    "_"
                );


        if (!filename) {
            filename = "collage";
        }


        pdf.save(
            filename + ".pdf"
        );

    }
);


/* INITIAL */

renderCanvas();

</script>

</body>
</html>
